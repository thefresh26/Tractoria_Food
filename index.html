<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Desayunos Trattoria · Menú del día</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Comida casera a domicilio. Bofe frito y canasta de plátano con chicharrón. Pide aquí y te lo llevamos.">
<meta name="theme-color" content="#D4222A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trattoria">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Lobster&amp;display=swap" rel="stylesheet">
<style>
:root{
  --red:#D4222A; --red-d:#A5161C; --green:#2F7D2F; --green-l:#5AA83A;
  --cream:#FBF3E4; --wood:#D9A46B; --wood-d:#B97A3F; --ink:#1B1B1B; --white:#fff;
  --line:#E3D3AE; --muted:#6B5A3E;
  --page-a:#D9A46B; --page-b:#B97A3F; --grain:rgba(70,35,10,.16);
  --f-script:Lobster,"Brush Script MT","Segoe Script",cursive;
  --f-cond:Anton,Impact,"Arial Narrow Bold","Arial Narrow",sans-serif;
  --f-serif:Georgia,"Times New Roman",serif;
  --f-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--page-a:#6E4824;--page-b:#4B2F14;--grain:rgba(0,0,0,.28)}
}
:root[data-theme="dark"]{--page-a:#6E4824;--page-b:#4B2F14;--grain:rgba(0,0,0,.28)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--page-b)}
html.lock{overflow:hidden}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{
  margin:0;min-height:100vh;font-family:var(--f-sans);font-size:17px;line-height:1.5;color:var(--ink);
  background-color:var(--page-b);
  background-image:
    repeating-linear-gradient(90deg,transparent 0 118px,var(--grain) 118px 120px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 3px,transparent 3px 9px),
    linear-gradient(180deg,var(--page-a),var(--page-b));
  -webkit-text-size-adjust:100%;
}
body.has-bar{padding-bottom:96px}
img,svg{max-width:100%}
a{color:var(--red-d)}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:8px;top:-60px;background:var(--cream);padding:10px 14px;border-radius:10px;z-index:100;font-weight:700}
.skip:focus{top:8px}

/* barra superior */
.topbar{background:var(--red-d);color:var(--cream)}
.topbar-in{max-width:1120px;margin:0 auto;padding:0 16px;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.install{background:transparent;color:var(--cream);border:1.5px solid rgba(251,243,228,.7);border-radius:999px;min-height:40px;padding:6px 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.install:hover{background:rgba(251,243,228,.14)}

.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 8px}
.view{animation:none}

/* placa del logo */
.plaque{position:relative;background:var(--cream);border:4px solid var(--green);border-radius:26px;padding:18px 16px 40px;text-align:center;overflow:hidden}
.roof{display:block;margin:0 auto -6px;width:150px;height:auto}
.wm{display:block;margin:0;font-weight:400}
.wm-d{display:block;font-family:var(--f-script);color:var(--green);font-size:clamp(50px,13vw,92px);line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.08)}
.wm-t{display:block;font-family:var(--f-cond);color:var(--ink);font-size:clamp(42px,11.5vw,80px);letter-spacing:.05em;line-height:1;margin-top:2px;
  text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff,1.5px 1.5px #fff,-1.5px 1.5px #fff,1.5px -1.5px #fff,-1.5px -1.5px #fff,0 5px 0 rgba(0,0,0,.2)}
.hat{position:absolute;top:14px;width:clamp(36px,9vw,58px);height:auto}
.hat.l{left:12px;transform:rotate(-14deg)}
.hat.r{right:12px;transform:rotate(14deg)}
.leaf{position:absolute;bottom:34px;width:clamp(34px,8vw,54px);height:auto}
.leaf.l{left:10px;transform:rotate(-8deg)}
.leaf.r{right:10px;transform:scaleX(-1) rotate(-8deg)}
.ribbon{position:relative;z-index:2;margin:-24px 18px 0;background:var(--red);color:#fff;text-align:center;border-radius:12px;padding:10px 14px;
  font-family:var(--f-cond);letter-spacing:.06em;font-size:clamp(15px,4vw,22px);line-height:1.2;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 4px 0 var(--red-d)}

/* secciones */
.h-script{font-family:var(--f-script);font-weight:400;color:var(--green);font-size:34px;line-height:1.1}
.h-script.sm{font-size:28px}
.muted{color:var(--muted)}
.fine{font-size:14px;color:var(--muted)}
.back{display:inline-flex;align-items:center;min-height:48px;background:var(--cream);color:var(--red-d);font-weight:800;text-decoration:none;border-radius:999px;padding:6px 18px;margin:20px 0 14px;border:2px solid var(--green)}

.inicio-grid{margin-top:22px}
.cards{display:grid;gap:18px;grid-template-columns:1fr}
.card{background:var(--cream);border:3px solid var(--green);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.art{background:#F3E1BD;border-bottom:3px solid var(--green)}
.art svg,.art img{display:block;width:100%;height:auto}
.card-b{padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{font-family:var(--f-serif);font-style:italic;font-weight:700;font-size:25px;line-height:1.2}
.card p{color:var(--muted);font-size:16px}
.stickers{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 6px}
.sticker{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:18px;padding:8px 14px;border-radius:12px;box-shadow:0 3px 0 var(--red-d)}
.card .btn{margin-top:auto}
.notices{margin-top:18px;background:var(--cream);border:3px dashed var(--green);border-radius:16px;padding:14px 16px;display:grid;gap:6px}
.notices p{font-weight:700;padding-left:22px;position:relative}
.notices p::before{content:"";position:absolute;left:0;top:.55em;width:10px;height:10px;border-radius:50%;background:var(--red)}

/* resumen fijo (computador) */
.summary{display:none;background:var(--cream);border:3px solid var(--green);border-radius:20px;padding:18px}
.summary ul,.lines{list-style:none;margin:0;padding:0}
.lines li{padding:10px 0;border-bottom:1px solid var(--line)}
.lines li:last-child{border-bottom:0}
.ln{display:flex;justify-content:space-between;gap:12px;font-weight:700}
.ln small{display:block;font-weight:400;color:var(--muted);font-size:15px}
.step{display:flex;align-items:center;gap:8px;margin-top:8px}
.step output{min-width:28px;text-align:center;font-weight:800;font-size:18px}
.step button,.qty button{width:48px;height:48px;border-radius:12px;border:2px solid var(--green);background:#fff;color:var(--ink);font-size:24px;font-weight:800;cursor:pointer;line-height:1;font-family:inherit}
.step .del{width:auto;padding:0 14px;font-size:15px;color:var(--red-d);border-color:var(--line);margin-left:auto}
.totalrow{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:800;margin:14px 0 12px;padding-top:12px;border-top:2px solid var(--ink)}
.totalrow strong{font-size:28px}
.summary .btn{width:100%}
.summary .notices{margin-top:14px;border-width:2px}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:12px 20px;border-radius:14px;border:0;cursor:pointer;font-family:inherit;font-size:17px;font-weight:800;text-decoration:none;line-height:1.2}
.btn-red{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-d)}
.btn-red:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-d)}
.btn-ghost{background:#fff;color:var(--red-d);border:2px solid var(--red)}
.btn-lg{min-height:56px;width:100%;font-size:18px}
.btn[disabled]{opacity:.6;cursor:default}

/* barra fija inferior (celular y tablet) */
.bar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--cream);border-top:3px solid var(--green);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar.show{display:block}
.bar-in{max-width:620px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.bar-in span{display:block;font-size:22px;font-weight:800;line-height:1.1}
.bar-in strong{display:block;font-size:14px;color:var(--muted);font-weight:700}
.bar .btn{min-width:150px}

/* hoja inferior / modal */
.scrim{position:fixed;left:0;right:0;top:0;bottom:0;z-index:50;background:rgba(27,27,27,.55);display:flex;align-items:flex-end;justify-content:center;visibility:hidden;opacity:0}
.scrim.open{visibility:visible;opacity:1}
.sheet{position:relative;background:var(--cream);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:26px 26px 0 0;border:3px solid var(--green);border-bottom:0;padding:22px 18px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%)}
.scrim.open .sheet{transform:none}
.sheet::before{content:"";display:block;width:48px;height:5px;border-radius:3px;background:var(--line);margin:-10px auto 14px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet-h h2{font-family:var(--f-serif);font-style:italic;font-size:26px;line-height:1.2}
.x{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:26px;line-height:1;cursor:pointer;font-family:inherit}
.sheet .desc{color:var(--muted);margin:4px 0 14px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:800;padding:0;margin-bottom:8px}
.opts{display:grid;gap:10px;margin-bottom:16px}
.tile{display:block;position:relative}
.tile input{position:absolute;opacity:0;width:100%;height:100%;left:0;top:0;margin:0;cursor:pointer}
.tile span{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;padding:10px 16px;border:3px solid var(--line);border-radius:14px;background:#fff;font-weight:700}
.tile input:checked + span{border-color:var(--green);background:#EAF4E2;box-shadow:inset 0 0 0 1px var(--green)}
.tile input:focus-visible + span{outline:3px solid var(--ink);outline-offset:2px}
.qty{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qty>span{font-weight:800;margin-right:auto}
.qty output{min-width:34px;text-align:center;font-size:24px;font-weight:800}
.sheet .totalrow{margin-top:4px}
.sheet .btn+.btn{margin-top:10px}
.sheet .fine{margin:2px 0 14px}
.sheet ol{padding-left:22px;margin:10px 0 14px}
.sheet li{margin-bottom:8px}

/* pago y datos */
.card-s{background:var(--cream);border:3px solid var(--green);border-radius:20px;padding:18px}
.pay-grid{display:grid;gap:18px;margin-top:18px}
.qr-card{text-align:center}
.qr-wrap{position:relative;margin:12px auto 10px;width:100%;max-width:300px}
.qr-wrap svg,.qr-wrap img{display:block;width:100%;height:auto;background:#fff;border-radius:16px;border:3px solid var(--ink)}
.qr-badge{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;background:#FFF1B8;border:1.5px solid #D9B73B;border-radius:8px;padding:4px 10px}
.qr-text{font-size:20px;line-height:1.3;margin:10px 0 12px}
.qr-text strong{color:var(--red-d)}
.numrow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-bottom:12px}
.numrow strong{font-size:20px;letter-spacing:.02em}
.form-card form{display:grid;gap:14px}
label.f{display:grid;gap:6px;font-weight:700}
.opt{font-weight:400;color:var(--muted)}
input[type=text],input[type=tel],input[type=url],input[type=password],textarea,select{width:100%;min-height:52px;padding:12px 14px;border:2px solid #C9B58F;border-radius:12px;background:#fff;font:inherit;font-size:17px;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
input[aria-invalid=true]{border-color:var(--red);background:#FFF3F2}
.ferr{color:var(--red-d);font-weight:700;font-size:15px;min-height:0}
.err{color:var(--red-d);font-weight:700}
input[type=file]{font:inherit;font-size:16px;padding:10px;border:2px dashed #C9B58F;border-radius:12px;background:#fff;width:100%}
.paychoice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-form-submit{display:none}

/* confirmación */
.done{text-align:center;max-width:620px;margin:20px auto 0}
.done svg.rider{display:block;width:100%;max-width:340px;height:auto;margin:0 auto 6px}
.ordnum{display:inline-block;background:var(--red);color:#fff;font-weight:800;border-radius:10px;padding:6px 14px;margin:8px 0}
.done .big{font-family:var(--f-serif);font-style:italic;font-weight:700;font-size:26px;line-height:1.25;margin:6px 0 14px}
.done .lines{text-align:left;margin:10px 0}
.kv{text-align:left;display:grid;gap:4px;font-size:16px;margin:10px 0 18px;padding:12px;background:#fff;border-radius:12px;border:2px solid var(--line)}
.done .btn{margin-top:10px}

/* PIN */
.pinbox{max-width:380px;margin:28px auto 0;text-align:center}
.dots{display:flex;justify-content:center;gap:14px;margin:16px 0 10px}
.dots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--green);background:#fff}
.dots i.on{background:var(--green)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px auto 8px;max-width:300px}
.keypad button{min-height:64px;border-radius:14px;border:2px solid var(--green);background:#fff;font-size:26px;font-weight:800;cursor:pointer;font-family:inherit}
.keypad button:active{background:#EAF4E2}
.keypad .blank{visibility:hidden}

/* panel */
.ptop{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--cream);border:3px solid var(--green);border-radius:20px;padding:14px 16px;margin-top:20px}
.seg{display:inline-flex;border:3px solid var(--green);border-radius:14px;overflow:hidden;background:#fff}
.seg button{min-height:48px;padding:0 20px;border:0;background:#fff;font:inherit;font-weight:800;cursor:pointer;font-size:16px}
.seg button[aria-pressed=true]{background:var(--green);color:#fff}
.kpis{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-top:16px}
.kpi{background:var(--cream);border:3px solid var(--green);border-radius:16px;padding:12px 14px}
.kpi .k{display:block;font-weight:700;font-size:15px;color:var(--muted);line-height:1.25}
.kpi strong{display:block;font-size:26px;line-height:1.2;margin-top:4px}
.kpi small{display:block;font-size:13px;color:var(--muted)}
.kpi.red{border-color:var(--red)}
.pgrid{display:grid;gap:16px;margin-top:16px}
.chart{background:var(--cream);border:3px solid var(--green);border-radius:20px;padding:16px}
.chart svg{display:block;width:100%;height:auto;margin-top:6px}
.orders{background:var(--cream);border:3px solid var(--green);border-radius:20px;padding:14px}
.orders h2{margin-bottom:10px}
.otable{width:100%;border-collapse:collapse}
.otable thead{display:none}
.otable tbody,.otable tr,.otable td{display:block}
.otable tr.o{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.otable td{padding:4px 0}
.otable tr.day td{font-weight:800;color:var(--green);padding:8px 2px 6px;font-size:17px}
.who b{display:block;font-size:18px}
.who .tm{font-weight:800;color:var(--red-d)}
.who a{color:var(--ink)}
.addr b{display:block}
.addr small{display:block;color:var(--muted);font-size:14px}
.amt b{font-size:20px}
.pill{display:inline-block;font-size:13px;font-weight:800;border-radius:999px;padding:2px 10px;margin-left:6px;border:1.5px solid var(--green);background:#EAF4E2}
.pill.cash{border-color:var(--wood-d);background:#F8E7CC}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--red-d);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;min-height:44px}
.stcell{display:flex;gap:8px;align-items:center;margin-top:6px}
.chip{flex:1;min-height:48px;border:0;border-radius:12px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;padding:0 14px}
.chip[disabled]{cursor:default}
.chip.s0{background:var(--red);color:#fff}
.chip.s1{background:#F4C542;color:var(--ink)}
.chip.s2{background:#7A4A1E;color:#fff}
.chip.s3{background:var(--green);color:#fff}
.prev{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:20px;cursor:pointer;font-family:inherit}
.prev[disabled]{opacity:.35;cursor:default}
.empty{text-align:center;padding:26px 10px}
.empty .btn{margin-top:14px}
details.settings{margin-top:16px;background:var(--cream);border:3px solid var(--green);border-radius:20px;padding:6px 16px}
details.settings summary{min-height:52px;display:flex;align-items:center;font-weight:800;cursor:pointer;list-style:none}
details.settings summary::-webkit-details-marker{display:none}
details.settings form{display:grid;gap:14px;padding:6px 0 16px}
.qrprev{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qrprev img{width:96px;height:96px;object-fit:contain;background:#fff;border:2px solid var(--line);border-radius:10px}
.danger{color:var(--red-d);border-color:var(--red)}

/* editor de menú */
.card .btn+.btn{margin-top:0}
.mlist{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:72px 1fr;gap:8px 12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px}
.thumb{display:block;width:72px;height:45px;border-radius:8px;overflow:hidden;background:#F3E1BD;border:2px solid var(--line)}
.thumb svg,.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb.big{width:132px;height:82px;flex:none}
.mi b{display:block;font-family:var(--f-serif);font-style:italic;font-size:18px;line-height:1.2}
.mi small{display:block;color:var(--muted);font-size:14px}
.ma{grid-column:1/-1;display:flex;gap:10px}
.ma .btn{flex:1}
.ph{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ph>div{flex:1;min-width:180px}
.dform{display:grid;gap:14px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) 104px 48px;gap:8px;margin-bottom:8px}
.x.sm{width:48px;height:48px;font-size:22px}

/* pie con mantel */
.foot{margin-top:34px}
.foot-in{max-width:620px;margin:0 auto 14px;background:var(--cream);border:3px solid var(--green);border-radius:16px;padding:12px 16px;text-align:center}
.foot-in p+p{margin-top:2px}
.mantel{height:86px;background-color:#fff;background-image:linear-gradient(90deg,rgba(212,34,42,.62) 50%,transparent 50%),linear-gradient(0deg,rgba(212,34,42,.62) 50%,transparent 50%);background-size:40px 40px;border-top:4px solid var(--red-d)}
#secret{cursor:default;padding:10px 4px}

/* visor de comprobante y aviso */
.lb{position:fixed;left:0;right:0;top:0;bottom:0;z-index:70;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:20px}
.lb img{max-width:100%;max-height:100%;border-radius:12px;background:#fff}
.lb .x{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px))}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;font-weight:700;padding:12px 20px;border-radius:12px;max-width:90vw;text-align:center;opacity:0;visibility:hidden}
.toast.show{opacity:1;visibility:visible}
body.has-bar .toast{bottom:calc(110px + env(safe-area-inset-bottom,0px))}

/* modo edición */
.editbar{display:flex;gap:8px}
body.editing [data-edit],body.editing [data-dish]{outline:2px dashed var(--green-l);outline-offset:3px;cursor:text;border-radius:6px}
body.editing [data-edit]:focus,body.editing [data-dish]:focus{outline:3px solid var(--green);background:rgba(255,255,255,.6)}
.editnote{background:#FFF1B8;border:2px solid #D9B73B;border-radius:12px;padding:10px 14px;font-weight:700;margin-bottom:14px}
.art{position:relative}
.photo-btn{position:absolute;right:10px;bottom:10px;display:none}
body.editing .photo-btn{display:inline-flex}
.photo-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.loading{text-align:center;padding:40px 10px;font-weight:700}

/* tablet */
@media (min-width:768px){
  .wrap{padding:28px 24px 8px}
  .cards{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .otable thead{display:table-header-group}
  .otable{display:table}
  .otable tbody{display:table-row-group}
  .otable tr{display:table-row}
  .otable td,.otable th{display:table-cell}
  .otable tr.o{background:none;border:0;border-radius:0;padding:0;margin:0}
  .otable td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .otable th{text-align:left;font-size:14px;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--green)}
  .otable tr.day{display:table-row}
  .otable tr.day td{display:table-cell;border-bottom:0;padding-top:14px}
  .stcell{margin-top:0;min-width:190px}
}
/* computador */
@media (min-width:1024px){
  .inicio-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:26px;align-items:start}
  .summary{display:block;position:sticky;top:16px}
  .pay-grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}
  .pay-grid.nopay{grid-template-columns:minmax(0,1fr);max-width:640px;margin-left:auto;margin-right:auto}
  .btn-form-submit{display:inline-flex}
  .bar,.bar.show{display:none}
  body.has-bar{padding-bottom:0}
  .scrim{align-items:center}
  .sheet{border-radius:26px;border-bottom:3px solid var(--green);transform:translateY(14px) scale(.98)}
  .sheet::before{display:none}
  .scrim.open .sheet{transform:none}
  .wrap.panel{max-width:1240px}
}
@media (min-width:1100px){
  .pgrid{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}
  .pgrid .chart{order:2;position:sticky;top:16px}
  .pgrid .orders{order:1}
}

/* movimiento: solo CSS, corto, y apagado si la persona lo pide */
@media (prefers-reduced-motion: no-preference){
  @keyframes pop{from{opacity:0;transform:scale(.7) rotate(-6deg)}to{opacity:1;transform:none}}
  .sticker{animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}
  .sticker:nth-child(2){animation-delay:.12s}
  .card:nth-child(2) .sticker{animation-delay:.2s}
  .card:nth-child(2) .sticker:nth-child(2){animation-delay:.3s}
  .scrim{transition:opacity .2s ease,visibility .2s}
  .sheet{transition:transform .26s ease}
  .toast{transition:opacity .2s,visibility .2s}
  .btn{transition:transform .08s}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

<script>
(function(){

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function fmtDay(t){var s=startOfDay(Date.now());if(startOfDay(t)===s)return 'Hoy';if(startOfDay(t)===s-864e5)return 'Ayer';var d=new Date(t);return WD[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];}
function toast(msg){var el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('show');},2600);}
function copyText(text,okMsg){
  function fb(){var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);toast(ok?okMsg:'No se pudo copiar. Cópialo a mano: '+text);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast(okMsg);},fb);}else fb();
}
function shrink(file,max,type,q){
  return new Promise(function(res,rej){
    var r=new FileReader();r.onerror=rej;
    r.onload=function(){var im=new Image();im.onerror=rej;
      im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);var x=c.getContext('2d');
        if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);}
        x.drawImage(im,0,0,c.width,c.height);try{res(c.toDataURL(type,q));}catch(e){rej(e);}};
      im.src=r.result;};
    r.readAsDataURL(file);
  });
}

/* ═══════════ 3. ESTADO ═══════════ */

    .then(function(r){return r.json().catch(function(){return {};}).then(function(j){
      if(r.status===401&&a!=='login'){setUnlocked(false);if(curView==='panel')location.hash='#vendedores';}
      if(!r.ok)throw new Error(j.error||'No se pudo conectar. Revisa tu internet.');return j;});});
}
function artFor(d){return /bofe/i.test(d.name)?'bofe':/canasta/i.test(d.name)?'canasta':'';}
function setData(j){
  if(j.settings){Object.keys(j.settings).forEach(function(k){if(j.settings[k]!=null&&j.settings[k]!=='')settings[k]=j.settings[k];else if(k==='qr')settings.qr=null;});}
  if(j.menu){var m=j.menu.map(function(d){d.art=artFor(d);return d;});ADMENU=m;MENU=m.filter(function(d){return d.active!==false;});}
  cart=cart.filter(function(c){var d=findDish(c.d);return d&&d.active!==false&&d.variants.some(function(v){return v.id===c.v;});});
  applyTexts();
}
function reloadData(){return api(unlocked()?'panel':'menu',unlocked()?{}:null).then(function(j){if(j.orders)orders=j.orders.map(function(o){o.id='DT-'+pad(o.num,4);return o;});setData(j);return j;});}
function applyTexts(){
  var els=document.querySelectorAll('[data-edit]');
  for(var i=0;i<els.length;i++){var k=els[i].getAttribute('data-edit');if(!editing||document.activeElement!==els[i])els[i].textContent=settings[k]||'';}
  var f=$('#fName');if(f)f.textContent=settings.t_nombre1+' '+settings.t_nombre2.charAt(0)+settings.t_nombre2.slice(1).toLowerCase();
}
var range='hoy',curView='inicio',sh=null,lastFocus=null,pinBuf='';
function unlocked(){return !!sget('dt_tok','');}
function setUnlocked(v){if(!v){sset('dt_tok','');ADMENU=[];setEditing(false);}renderEditCtl();}
function saveCart(){sset('dt_cart',cart);}
function cartCount(){return cart.reduce(function(a,c){return a+c.q;},0);}
function lineInfo(c){var d=findDish(c.d),v=findVar(d,c.v);return {name:d.name,label:v.label,price:v.price,q:c.q};}
function cartTotal(){return cart.reduce(function(a,c){var l=lineInfo(c);return a+l.price*l.q;},0);}
function orderTotal(o){return o.lines.reduce(function(a,l){return a+l.p*l.q;},0);}

/* ═══════════ 4. ILUSTRACIONES (SVG en línea, sin imágenes pesadas) ═══════════ */
var ROOF='<svg class="roof" viewBox="0 0 240 92" aria-hidden="true"><rect x="168" y="10" width="28" height="40" fill="#A5161C"/><rect x="163" y="5" width="38" height="10" rx="3" fill="#D4222A"/><path d="M8 84 L120 10 L232 84Z" fill="#D4222A" stroke="#A5161C" stroke-width="7" stroke-linejoin="round"/><path d="M44 72 L120 22 M72 78 L134 36 M100 82 L150 50" stroke="#A5161C" stroke-width="3" opacity=".5" fill="none"/></svg>';
var HAT='<svg viewBox="0 0 64 64" aria-hidden="true"><g fill="#fff" stroke="#1B1B1B" stroke-width="3" stroke-linejoin="round"><circle cx="19" cy="26" r="12"/><circle cx="32" cy="19" r="14"/><circle cx="45" cy="26" r="12"/><path d="M17 34h30v19a3 3 0 0 1-3 3H20a3 3 0 0 1-3-3z"/></g><path d="M17 45h30" stroke="#1B1B1B" stroke-width="3"/></svg>';
var LEAF='<svg viewBox="0 0 60 40" aria-hidden="true"><path d="M4 36C10 8 38 2 56 6 52 28 28 40 4 36Z" fill="#5AA83A" stroke="#2F7D2F" stroke-width="3" stroke-linejoin="round"/><path d="M6 34C22 24 36 16 52 8" stroke="#2F7D2F" fill="none" stroke-width="2.5"/></svg>';
var ART={
  generic:function(){return '<svg viewBox="0 0 400 250" role="img" aria-label="Plato"><ellipse cx="200" cy="224" rx="150" ry="13" fill="rgba(70,35,10,.22)"/><ellipse cx="200" cy="140" rx="160" ry="92" fill="#fff" stroke="#E4D7BC" stroke-width="6"/><ellipse cx="200" cy="140" rx="126" ry="68" fill="#F8F0DE"/><g stroke-width="3"><circle cx="170" cy="130" r="26" fill="#E6B93D" stroke="#C48F1C"/><circle cx="226" cy="146" r="30" fill="#D8442A" stroke="#A5161C"/><circle cx="206" cy="112" r="20" fill="#5AA83A" stroke="#2F7D2F"/></g></svg>';},
  bofe:function(){return '<svg viewBox="0 0 400 250" role="img" aria-label="Plato de bofe frito con yuca y patacones"><ellipse cx="200" cy="224" rx="150" ry="13" fill="rgba(70,35,10,.22)"/><ellipse cx="200" cy="140" rx="160" ry="92" fill="#fff" stroke="#E4D7BC" stroke-width="6"/><ellipse cx="200" cy="140" rx="126" ry="68" fill="#F8F0DE"/><ellipse cx="302" cy="100" rx="30" ry="14" fill="#fff" stroke="#E4D7BC" stroke-width="4"/><ellipse cx="302" cy="98" rx="22" ry="9" fill="#D8442A"/><circle cx="296" cy="96" r="3" fill="#F4A23B"/><g fill="#F2DDA0" stroke="#D9BE72" stroke-width="2.5"><rect x="238" y="128" width="74" height="17" rx="6" transform="rotate(-18 275 136)"/><rect x="244" y="146" width="74" height="17" rx="6" transform="rotate(-6 281 154)"/><rect x="236" y="162" width="70" height="17" rx="6" transform="rotate(10 271 170)"/><rect x="224" y="118" width="66" height="16" rx="6" transform="rotate(-30 257 126)"/></g><g fill="#E6B93D" stroke="#C48F1C" stroke-width="3"><ellipse cx="108" cy="170" rx="24" ry="15"/><ellipse cx="142" cy="188" rx="22" ry="14"/><ellipse cx="94" cy="140" rx="20" ry="13"/></g><path d="M94 170h28M130 188h24M82 140h24" stroke="#C48F1C" stroke-width="2" opacity=".7"/><g stroke="#6E3512" stroke-width="3"><rect x="130" y="92" width="96" height="30" rx="15" fill="#9A5524" transform="rotate(-10 178 107)"/><rect x="146" y="120" width="104" height="32" rx="16" fill="#8A4A1E" transform="rotate(6 198 136)"/><rect x="140" y="148" width="88" height="28" rx="14" fill="#A35C28" transform="rotate(-4 184 162)"/></g><g stroke="#D69A5C" stroke-width="3" stroke-linecap="round" opacity=".75"><path d="M150 100l60-10M168 130l62 8M160 158l54-3"/></g></svg>';},
  canasta:function(){return '<svg viewBox="0 0 400 250" role="img" aria-label="Canasta de plátano con chicharrón y guacamole"><ellipse cx="200" cy="228" rx="150" ry="13" fill="rgba(70,35,10,.22)"/><path d="M262 184Q262 226 312 226 362 226 362 184Z" fill="#fff" stroke="#E4D7BC" stroke-width="4"/><ellipse cx="312" cy="184" rx="50" ry="16" fill="#86B84D" stroke="#E4D7BC" stroke-width="4"/><g fill="#5E8F2E"><circle cx="296" cy="182" r="4"/><circle cx="318" cy="186" r="5"/><circle cx="332" cy="180" r="3.5"/></g><path d="M76 134H324L292 218H108Z" fill="#C4893A" stroke="#8E5C1E" stroke-width="4" stroke-linejoin="round"/><g stroke="#8E5C1E" stroke-width="3" opacity=".6" fill="none"><path d="M90 158H310M100 182H300M106 204H294"/><path d="M118 134L128 218M158 134L162 218M200 134V218M242 134L238 218M282 134L272 218"/></g><g fill="#E0A94A" stroke="#B8741F" stroke-width="3"><ellipse cx="120" cy="116" rx="34" ry="20" transform="rotate(-14 120 116)"/><ellipse cx="172" cy="98" rx="38" ry="22" transform="rotate(10 172 98)"/><ellipse cx="228" cy="106" rx="36" ry="22" transform="rotate(-8 228 106)"/><ellipse cx="276" cy="120" rx="30" ry="18" transform="rotate(14 276 120)"/><ellipse cx="200" cy="124" rx="42" ry="16"/></g><g stroke="#B8741F" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".8"><path d="M104 112l16-6M158 94l18 6M214 104l16-8M266 118l14 4M186 122l24 2"/></g><rect x="66" y="126" width="268" height="16" rx="8" fill="#D9A04A" stroke="#8E5C1E" stroke-width="4"/></svg>';}
};
var RIDER='<svg class="rider" viewBox="0 0 320 200" role="img" aria-label="Repartidor en moto roja llevando tu pedido"><g stroke="#B97A3F" stroke-width="4" stroke-linecap="round" opacity=".7"><path d="M6 80h34M0 104h28M12 128h30"/></g><path d="M0 182H320" stroke="#8B5E34" stroke-width="4" stroke-dasharray="14 12"/><g><circle cx="76" cy="152" r="28" fill="#333" stroke="#1B1B1B" stroke-width="5"/><circle cx="76" cy="152" r="10" fill="#ccc"/><circle cx="252" cy="152" r="28" fill="#333" stroke="#1B1B1B" stroke-width="5"/><circle cx="252" cy="152" r="10" fill="#ccc"/></g><rect x="54" y="140" width="44" height="8" rx="4" fill="#999"/><path d="M76 152L112 114H192L224 94L240 122L252 152" fill="none" stroke="#D4222A" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/><path d="M120 114Q150 86 196 102L206 120H120Z" fill="#D4222A" stroke="#A5161C" stroke-width="3"/><rect x="88" y="98" width="72" height="14" rx="7" fill="#1B1B1B"/><path d="M224 94L252 152" stroke="#1B1B1B" stroke-width="6" stroke-linecap="round"/><path d="M214 88L234 80" stroke="#1B1B1B" stroke-width="6" stroke-linecap="round"/><circle cx="242" cy="104" r="7" fill="#FFD34D"/><rect x="22" y="62" width="72" height="54" rx="6" fill="#D4222A" stroke="#A5161C" stroke-width="4"/><rect x="22" y="62" width="72" height="14" rx="4" fill="#A5161C"/><rect x="32" y="86" width="52" height="10" rx="2" fill="#FBF3E4"/><path d="M128 104L148 58L178 62L168 106Z" fill="#2F7D2F"/><circle cx="174" cy="44" r="15" fill="#F0C08A"/><path d="M158 44A16 16 0 0 1 190 44V48H158Z" fill="#D4222A"/><rect x="158" y="40" width="32" height="4" fill="#fff"/><path d="M162 68L214 88" stroke="#2F7D2F" stroke-width="11" stroke-linecap="round"/><circle cx="217" cy="89" r="6" fill="#F0C08A"/><path d="M142 104L178 122L168 148" fill="none" stroke="#1B1B1B" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/><rect x="160" y="144" width="22" height="8" rx="4" fill="#1B1B1B"/></svg>';
function fakeQR(){
  var n=25,s=8,seed=20260101;
  function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
  var d='';
  for(var y=0;y<n;y++){for(var x=0;x<n;x++){
    var on,inF=(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
    if(inF){var fx=x>=n-7?x-(n-7):x,fy=y>=n-7?y-(n-7):y;on=(fx===0||fx===6||fy===0||fy===6)||(fx>=2&&fx<=4&&fy>=2&&fy<=4);}
    else if((x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8)){on=false;}
    else on=rnd()>.52;
    if(on)d+='M'+(x*s)+' '+(y*s)+'h'+s+'v'+s+'h-'+s+'z';
  }}
  var w=n*s+32;
  return '<svg viewBox="-16 -16 '+w+' '+w+'" role="img" aria-label="Código QR de ejemplo"><rect x="-16" y="-16" width="'+w+'" height="'+w+'" fill="#fff"/><path d="'+d+'" fill="#1B1B1B"/></svg>';
}

/* ═══════════ 5. VISTAS PÚBLICAS ═══════════ */

  return '<div class="plaque"><span class="hat l">'+HAT+'</span><span class="hat r">'+HAT+'</span>'+ROOF+
    '<h1 class="wm" aria-label="'+esc(settings.t_nombre1+' '+settings.t_nombre2)+'"><span class="wm-d" data-edit="t_nombre1">'+esc(settings.t_nombre1)+'</span><span class="wm-t" data-edit="t_nombre2">'+esc(settings.t_nombre2)+'</span></h1>'+
    '<span class="leaf l">'+LEAF+'</span><span class="leaf r">'+LEAF+'</span></div>'+
    '<div class="ribbon" data-edit="t_lema">'+esc(settings.t_lema)+'</div>';
}

function cardHTML(d){
  var multi=d.variants.length>1;
  var stick=d.variants.map(function(v){return '<span class="sticker">'+(multi?esc(v.label)+' ':'')+money(v.price)+'</span>';}).join('');
  var ph=pending[d.id]&&pending[d.id].photo||d.photo;

var ed=null;
function coverImage(file,w,h,q){
  return new Promise(function(res,rej){
    var r=new FileReader();r.onerror=rej;
    r.onload=function(){var im=new Image();im.onerror=rej;
      im.onload=function(){var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');var s=Math.max(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;
        x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);
        try{var u=c.toDataURL('image/webp',q);if(u.indexOf('data:image/webp')!==0)u=c.toDataURL('image/jpeg',q);res(u);}catch(e){rej(e);}};
      im.src=r.result;};
    r.readAsDataURL(file);
  });
}

function syncVariants(){
  var l=document.querySelectorAll('#vrows .vl'),p=document.querySelectorAll('#vrows .vp');

}
function saveDish(){
  syncVariants();
  var name=$('#dName').value.trim(),desc=$('#dDesc').value.trim(),err=$('#dErr');
  var vs=ed.variants.map(function(v){return {id:v.id,label:v.label,price:parseInt(String(v.price).replace(/\D/g,''),10)||0};}).filter(function(v){return v.price>0;});
  if(name.length<2){err.textContent='Escribe el nombre del plato.';$('#dName').focus();return;}
  if(!vs.length){err.textContent='Escribe el precio de al menos una opción.';return;}
  if(vs.length>1&&vs.some(function(v){return !v.label;})){err.textContent='Cuando hay varias opciones, ponle nombre a cada una.';return;}
  err.textContent='';
  var btn=$('#dishForm [type=submit]');btn.disabled=true;
  api('plato',{id:ed.id,name:name,desc:desc,photo:ed.photo||null,variants:vs,active:$('#dActive').checked})
    .then(reloadData).then(function(){afterMenuChange('Plato guardado');showSheet(menuListHTML());},function(e){btn.disabled=false;err.textContent=e.message;});
}

/* ═══════════ 8. RUTAS ═══════════ */
var VIEWS=['inicio','pedido','listo','pin','panel'];
function updateBar(){
  var b=$('#bar'),n=cartCount();
  if(curView==='inicio'&&n>0){b.className='bar show';b.innerHTML='<div class="bar-in"><div><strong>'+n+(n===1?' plato':' platos')+'</strong><span>'+money(cartTotal())+'</span></div><a class="btn btn-red" href="#pedido">Ver pedido</a></div>';document.body.classList.add('has-bar');}
  else if(curView==='pedido'&&n>0){b.className='bar show';b.innerHTML='<div class="bar-in"><div><strong>Total a pagar</strong><span>'+money(cartTotal())+'</span></div><button class="btn btn-red" type="submit" form="orderForm">Confirmar pedido</button></div>';document.body.classList.add('has-bar');}
  else{b.className='bar';b.innerHTML='';document.body.classList.remove('has-bar');}
}
function route(){
  var h=(location.hash||'#inicio').slice(1);
  if(['inicio','pedido','listo','vendedores'].indexOf(h)<0)h='inicio';
  var view=h==='vendedores'?(unlocked()?'panel':'pin'):h;
  if(view==='listo'){var o=lastOrder();if(!o){location.replace('#inicio');return;}renderListo(o);}
  closeSheet();
  curView=view;
  VIEWS.forEach(function(v){$('#v-'+v).hidden=(v!==view);});
  $('#main').className='wrap'+(view==='panel'?' panel':'');
  if(view==='inicio')renderInicio();
  if(view==='pedido')renderPedido();
  if(view==='pin')renderPin();
  if(view==='panel')renderPanel();
  document.title={inicio:'Desayunos Trattoria · Menú del día',pedido:'Tu pedido · Desayunos Trattoria',listo:'Pedido confirmado · Desayunos Trattoria',pin:'Acceso · Desayunos Trattoria',panel:'Panel de vendedoras · Desayunos Trattoria'}[view];
  if(view!=='inicio'&&editing){editing=false;document.body.classList.remove('editing');}
  renderEditCtl();applyTexts();updateBar();window.scrollTo(0,0);
}
function refreshCart(){
  saveCart();
  if(!cart.length&&curView==='pedido'){renderPedido();}
  else if(curView==='pedido')refreshCheckout();
  var a=$('#aside');if(a)a.innerHTML=asideHTML();
  updateBar();
}

  },

  ldel:function(t){cart.splice(+t.getAttribute('data-i'),1);refreshCart();},

  next:function(t){changeStatus(t.getAttribute('data-id'),1);},
  prev:function(t){changeStatus(t.getAttribute('data-id'),-1);},
  lb:function(t){var o=orders.filter(function(x){return x.id===t.getAttribute('data-id');})[0];if(!o)return;toast('Cargando comprobante…');api('comprobante',{id:o.num}).then(function(j){if(j.proof){$('#lbImg').src=j.proof;$('#lb').hidden=false;$('#lb .x').focus();}},function(e){toast(e.message);});},
  lbclose:function(){$('#lb').hidden=true;$('#lbImg').removeAttribute('src');},
  delqr:function(){settings.qr=null;api('ajustes',{qr:''}).catch(function(e){toast(e.message);});var d=$('#settings');if(d){var w=d.open;$('#v-panel').querySelector('#settings').outerHTML=settingsHTML();$('#settings').open=w;}toast('QR quitado');},
  menuedit:function(){showSheet(menuListHTML());},
  dishnew:function(){ed={id:null,art:'',name:'',desc:'',photo:null,variants:[{id:'v'+Date.now(),label:'',price:''}]};showSheet(dishFormHTML());},
  dishedit:function(t){var d=findDish(t.getAttribute('data-id'));if(!d)return;ed={id:d.id,active:d.active,art:d.art||'',name:d.name,desc:d.desc,photo:d.photo||null,variants:d.variants.map(function(v){return {id:v.id,label:v.label,price:v.price};})};showSheet(dishFormHTML());},
  dishdel:function(t){var d=findDish(t.getAttribute('data-id'));if(!d)return;if(ADMENU.length<2){toast('Deja al menos un plato en el menú.');return;}if(!confirm('¿Quitar «'+d.name+'» del menú para siempre? Si solo no lo tienes hoy, mejor desmárcalo como disponible.'))return;api('borrar',{id:d.id}).then(reloadData).then(function(){afterMenuChange('Plato quitado');showSheet(menuListHTML());},function(e){toast(e.message);});},
  editon:function(){setEditing(true);},
  editcancel:function(){pending={};setEditing(false);},
  editsave:function(t){saveEdits(t);},
  vadd:function(){syncVariants();ed.variants.push({id:'v'+Date.now(),label:'',price:''});$('#vrows').innerHTML=vrowsHTML();var i=document.querySelectorAll('#vrows .vl');if(i.length)i[i.length-1].focus();},
  vdel:function(t){syncVariants();if(ed.variants.length<2){toast('El plato necesita al menos una opción con precio.');return;}ed.variants.splice(+t.getAttribute('data-i'),1);$('#vrows').innerHTML=vrowsHTML();},
  photodel:function(t){ed.photo=null;dishPreview();t.hidden=true;},

};
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-act]'):null;
  if(t&&H[t.getAttribute('data-act')]){H[t.getAttribute('data-act')](t,e);return;}
  if(e.target.id==='scrim')closeSheet();
  if(e.target.id==='lb')H.lbclose();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='var'&&sh){sh.vid=t.value;updateSheetTotal();}
  else if(t.name==='pay'){applyPay(t.value);}
  else if(t.id==='dPhoto'&&t.files&&t.files[0]){
    coverImage(t.files[0],640,400,.78).then(function(u){ed.photo=u;dishPreview();var b=$('[data-act="photodel"]');if(b)b.hidden=false;},function(){toast('No se pudo leer esa imagen. Prueba con otra.');});
  }
  else if(t.id==='sQR'&&t.files&&t.files[0]){
    shrink(t.files[0],640,'image/png').then(function(u){return api('ajustes',{qr:u}).then(function(){return u;});}).then(function(u){settings.qr=u;toast('QR guardado');var w=$('#settings').open;$('#settings').outerHTML=settingsHTML();$('#settings').open=w;},function(e){toast(e&&e.message||'No se pudo leer esa imagen.');});
  }

    coverImage(t.files[0],640,400,.78).then(function(u){pending[id]=pending[id]||{};pending[id].photo=u;var img=t.closest('.art');img.querySelector('img,svg').outerHTML='<img src="'+u+'" alt="" width="400" height="250">';toast('Foto lista. Toca «Guardar» para publicarla.');},function(){toast('No se pudo leer esa imagen. Prueba con otra.');});

document.addEventListener('submit',function(e){
  var f=e.target;
  if(f.id==='orderForm'){e.preventDefault();submitOrder(f);}
  if(f.id==='settingsForm'){e.preventDefault();saveSettings();}
  if(f.id==='loginForm'){e.preventDefault();doLogin();}
  if(f.id==='dishForm'){e.preventDefault();saveDish();}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(!$('#lb').hidden)H.lbclose();else closeSheet();return;}
  if(e.key==='Tab'&&$('#scrim').classList.contains('open')){
    var f=[].slice.call($('#sheet').querySelectorAll('button,a[href],input,select,textarea')).filter(function(x){return !x.disabled&&x.offsetParent!==null;});
    if(!f.length)return;var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    return;
  }
  if(editing&&e.key==='Enter'&&e.target.isContentEditable){e.preventDefault();e.target.blur();}
});
function submitOrder(form){
  var g=function(id){return $('#'+id).value.trim();};
  var name=g('fName'),phone=g('fPhone').replace(/\D/g,''),addr=g('fAddr'),barrio=g('fBarrio');
  var pay=form.querySelector('input[name=pay]:checked').value,first=null;
  function bad(id,msg){var i=$('#'+id);i.setAttribute('aria-invalid','true');$('#'+id+'E').textContent=msg;if(!first)first=i;}
  ['fName','fPhone','fAddr','fBarrio'].forEach(function(id){$('#'+id).removeAttribute('aria-invalid');$('#'+id+'E').textContent='';});
  if(name.length<2)bad('fName','Escribe tu nombre.');
  if(!/^3\d{9}$/.test(phone))bad('fPhone','Escribe tu celular de 10 dígitos. Empieza por 3.');
  if(addr.length<5)bad('fAddr','Escribe la dirección completa.');
  if(barrio.length<2)bad('fBarrio','Escribe el barrio.');
  $('#formErr').textContent=first?'Revisa los campos marcados para confirmar tu pedido.':'';
  if(first){first.focus();return;}
  var btns=document.querySelectorAll('button[form="orderForm"],.btn-form-submit');for(var i=0;i<btns.length;i++)btns[i].disabled=true;
  var file=pay==='nequi'&&$('#fProof').files&&$('#fProof').files[0];
  function finish(proof){
    api('pedido',{name:name,phone:phone,address:addr,barrio:barrio,ref:g('fRef'),pay:pay,proof:proof||null,notes:g('fNotes'),
      lines:cart.map(function(c){return {d:c.d,v:c.v,q:c.q};})})
    .then(function(r){
      var o={id:'DT-'+pad(r.id,4),num:r.id,ts:r.ts,name:name,phone:phone,address:addr,barrio:barrio,ref:g('fRef'),pay:pay,notes:g('fNotes'),st:0,lines:r.lines};
      sset('dt_lastorder',o);cart=[];saveCart();location.hash='#listo';
    },function(e){for(var i=0;i<btns.length;i++)btns[i].disabled=false;$('#formErr').textContent=e.message;});
  }
  if(file)shrink(file,720,'image/jpeg',.72).then(finish,function(){finish(null);});else finish(null);
}
function saveSettings(){
  var nq=$('#sNequi').value.trim(),wa=$('#sWa').value.replace(/\D/g,''),err=$('#sErr');
  if(nq.replace(/\D/g,'').length<7){err.textContent='Escribe un número de Nequi válido.';return;}
  if(wa.length<10){err.textContent='Escribe el WhatsApp con 57 al inicio, sin espacios.';return;}
  err.textContent='';
  api('ajustes',{nequi:nq,wa:wa}).then(function(){settings.nequi=nq;settings.wa=wa;toast('Cambios guardados');},function(e){err.textContent=e.message;});
}
/* ═══════════ MODO EDICIÓN EN LA PÁGINA ═══════════ */
function renderEditCtl(){
  var c=$('#editCtl');if(!c)return;
  if(!unlocked()||curView!=='inicio'){c.innerHTML=unlocked()?'<a class="install" href="#inicio" style="text-decoration:none;display:inline-flex;align-items:center">Ver menú</a>':'';return;}
  c.innerHTML=editing?'<button class="install" type="button" data-act="editcancel">Cancelar</button> <button class="install" type="button" data-act="editsave" style="background:#2F7D2F;border-color:#2F7D2F">Guardar</button>'
    :'<button class="install" type="button" data-act="editon">Editar página</button> <a class="install" href="#vendedores" style="text-decoration:none;display:inline-flex;align-items:center">Panel</a>';
}
function setEditing(on){
  editing=!!on&&unlocked();document.body.classList.toggle('editing',editing);
  if(curView==='inicio')renderInicio();
  var els=document.querySelectorAll('[data-edit],[data-dish]');
  for(var i=0;i<els.length;i++){if(editing){els[i].setAttribute('contenteditable','true');els[i].setAttribute('spellcheck','true');}else els[i].removeAttribute('contenteditable');}
  renderEditCtl();
}
function saveEdits(btn){
  var calls=[],aj={},changed=false;
  var els=document.querySelectorAll('[data-edit]');
  for(var i=0;i<els.length;i++){var k=els[i].getAttribute('data-edit'),v=els[i].textContent.replace(/\s+/g,' ').trim();if(v&&v!==settings[k]){aj[k]=v;changed=true;}}
  if(changed)calls.push(api('ajustes',aj));
  var ds=document.querySelectorAll('[data-dish]');
  for(i=0;i<ds.length;i++){var id=ds[i].getAttribute('data-id'),f=ds[i].getAttribute('data-dish'),val=ds[i].textContent.replace(/\s+/g,' ').trim();var d=findDish(id);if(d&&val&&val!==d[f]){pending[id]=pending[id]||{};pending[id][f]=val;}}
  Object.keys(pending).forEach(function(id){var d=findDish(id);if(!d)return;var p=pending[id];
    calls.push(api('plato',{id:d.id,name:p.name||d.name,desc:p.desc!=null?p.desc:d.desc,photo:p.photo||d.photo||null,variants:d.variants,active:d.active!==false}));});
  if(!calls.length){setEditing(false);toast('No había cambios.');return;}
  btn.disabled=true;toast('Guardando…');
  Promise.all(calls).then(reloadData).then(function(){pending={};setEditing(false);toast('¡Listo! Los clientes ya ven los cambios.');},function(e){btn.disabled=false;toast('No se guardó: '+e.message);});
}
document.addEventListener('paste',function(e){if(editing&&e.target.isContentEditable){e.preventDefault();var t=(e.clipboardData||window.clipboardData).getData('text');document.execCommand('insertText',false,t.replace(/\s+/g,' '));}});

    x.fillStyle='#FBF3E4';x.font='bold '+(120*s)+'px Impact,"Arial Black",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('DT',256*s,368*s);
    return c.toDataURL('image/png');
